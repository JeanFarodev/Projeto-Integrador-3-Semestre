<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Novo Lançamento</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-xl border border-slate-200 shadow-md w-full max-w-lg mx-4">
        <div class="mb-6">
            <h2 class="text-2xl font-bold text-slate-900">Novo Lançamento</h2>
            <p class="text-sm text-slate-500">Insira os detalhes da movimentação financeira.</p>
        </div>

        <form th:action="@{/caixa/salvar}" th:object="${lancamento}" method="POST" class="space-y-4">
            
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Descrição</label>
                <input type="text" th:field="*{descricao}" required placeholder="Ex: Pagamento Fornecedor, Venda..." 
                       class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Categoria</label>
                <select th:field="*{categoria}" required 
                        class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm bg-white">
                    <option value="" disabled selected>Selecione uma categoria...</option>
                    <option th:each="cat : ${listaCategorias}" 
                            th:value="${cat.id}" 
                            th:text="${cat.nome} + ' (' + ${cat.tipo} + ')'">
                    </option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Valor (R$)</label>
                <input type="number" step="0.01" th:field="*{valor}" required placeholder="Ex: 1500.00" 
                       class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Data do Lançamento</label>
                <input type="date" th:field="*{data}" required 
                       class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
            </div>

            <div class="flex justify-end space-x-3 pt-4 border-t border-slate-100">
                <a th:href="@{/caixa/dashboard}" class="px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-lg transition">
                    Cancelar
                </a>
                <button type="submit" class="px-4 py-2 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-lg transition shadow-sm">
                    Salvar Lançamento
                </button>
            </div>
        </form>
    </div>

</body>
</html>
