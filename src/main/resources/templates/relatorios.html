<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatórios - Sistema de Gestão</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { primary: '#1c3e86', accent: '#2f65f6', success: '#0aa958', danger: '#df2727', background: '#f4f6fa' } } }
        }
    </script>
</head>
<body class="flex flex-col h-screen bg-background text-slate-800 font-sans overflow-hidden">

    <header class="bg-primary text-white py-4 px-6 flex justify-between items-center shrink-0">
        <div class="flex items-center gap-3 text-lg font-semibold"><i class='bx bx-laptop text-2xl'></i><span>Sistema de Gestão de Caixa</span></div>
        <div class="flex items-center gap-5 text-xl"><i class='bx bxs-user-circle'></i></div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        
        <aside class="w-[260px] bg-white flex flex-col justify-between border-r border-slate-200 shrink-0">
            <nav class="p-4 mt-2 overflow-y-auto">
                <ul class="flex flex-col gap-1">
                    <li><a th:href="@{/dashboard}" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-500 hover:bg-slate-50 font-semibold text-sm transition-colors"><i class='bx bxs-right-arrow-circle text-lg'></i> Dashboard</a></li>
                    <li><a th:href="@{/movimentacoes}" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-500 hover:bg-slate-50 font-semibold text-sm transition-colors"><i class='bx bx-plus-medical text-lg'></i> Movimentações</a></li>
                    <li><a th:href="@{/fechamento}" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-500 hover:bg-slate-50 font-semibold text-sm transition-colors"><i class='bx bx-briefcase text-lg'></i> Fechamento</a></li>
                    <li><a th:href="@{/relatorios}" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-accent text-white font-semibold text-sm shadow-sm transition-colors"><i class='bx bx-envelope text-lg'></i> Relatórios</a></li>
                    <li><a th:href="@{/produtos}" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-500 hover:bg-slate-50 font-semibold text-sm transition-colors"><i class='bx bxs-user-detail text-lg'></i> Produtos</a></li>
                    <li><a th:href="@{/configuracoes}" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-500 hover:bg-slate-50 font-semibold text-sm transition-colors"><i class='bx bx-cog text-lg'></i> Configurações</a></li>
                </ul>
            </nav>
        </aside>

        <main class="flex-1 p-8 overflow-y-auto flex flex-col gap-6">
            <h2 class="text-2xl font-bold text-slate-800">Emissão de Relatórios</h2>
            
            <div class="bg-white rounded-2xl shadow-sm p-6 border border-slate-100">
                <h3 class="text-lg font-bold mb-4">Relatórios Disponíveis</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    <div th:each="relatorio : ${listaRelatorios}" class="border border-slate-200 p-4 rounded-xl hover:border-accent hover:shadow-md transition cursor-pointer flex flex-col justify-between h-32">
                        <div>
                            <h4 class="font-bold text-slate-800 text-sm" th:text="${relatorio.titulo}">Título</h4>
                            <p class="text-xs text-slate-500 mt-1" th:text="${relatorio.descricao}">Descrição</p>
                        </div>
                        <div class="text-right">
                            <button class="text-accent text-sm font-semibold hover:underline">Gerar PDF</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
