<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatórios - Sistema de Gestão</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: { extend: { colors: { primary: '#1a2d62', accent: '#2b5aee', success: '#0aa958', danger: '#df2727', background: '#f4f6fa' } } }
        }
    </script>
    <style type="text/tailwindcss">
        @layer components {
            .icon-action { @apply cursor-pointer hover:text-slate-300 transition text-white; }
        }
    </style>
</head>
<body class="flex flex-col h-screen bg-background text-slate-800 font-sans overflow-hidden">

    <header class="bg-primary text-white py-3 px-6 flex justify-between items-center shrink-0 shadow-md z-10">
        <div class="flex items-center gap-3 text-lg font-semibold tracking-wide">
            <i class='bx bx-desktop text-2xl'></i>
            <span>Sistema de Gestão de Caixa</span>
        </div>
        
        <div class="flex items-center gap-5 text-xl">
            <div class="relative mt-1">
                <i class='bx bxs-bell icon-action'></i>
                <span class="absolute -top-1 -right-1 w-2.5 h-2.5 bg-red-500 rounded-full border-2 border-primary"></span>
            </div>
            
            <div class="relative flex items-center">
                <div class="w-9 h-9 flex items-center justify-center bg-slate-300 rounded-full cursor-pointer overflow-hidden border-2 border-transparent hover:border-white transition"
                     onclick="toggleMenuUsuario()" title="Menu do usuário">
                    <img src="https://randomuser.me/api/portraits/women/44.jpg" alt="Foto" class="w-full h-full object-cover">
                </div>
                
                <div id="menuUsuario" class="hidden absolute right-0 top-full mt-3 w-72 bg-white rounded-xl shadow-lg border border-slate-100 z-50 overflow-hidden transform origin-top-right transition-all text-left">
                    <div class="p-5 border-b border-slate-100 bg-white flex items-center gap-4">
                        <img src="https://randomuser.me/api/portraits/women/44.jpg" alt="Foto do Usuário" class="w-12 h-12 rounded-full object-cover border border-slate-100 shadow-sm">
                        <div class="flex flex-col">
                            <span class="text-base font-bold text-slate-800">Ana Silva</span>
                            <span class="text-sm text-slate-500 font-medium">ana.silva@sistema.com.br</span>
                        </div>
                    </div>
                    <div class="p-2 space-y-1">
                        <a href="#" class="flex items-center gap-3 px-4 py-2.5 text-slate-700 hover:bg-slate-50 font-medium rounded-lg transition text-sm">
                            <i class='bx bx-user text-lg text-slate-400'></i> Meu Perfil
                        </a>
                        <a href="#" class="flex items-center gap-3 px-4 py-2.5 text-slate-700 hover:bg-slate-50 font-medium rounded-lg transition text-sm">
                            <i class='bx bx-cog text-lg text-slate-400'></i> Configurações
                        </a>
                    </div>
                    <div class="p-2 border-t border-slate-100">
                        <a href="#" class="flex items-center gap-3 px-4 py-2.5 text-[#d93025] hover:bg-red-50 rounded-lg transition font-medium text-sm">
                            <i class='bx bx-log-out text-lg'></i> Sair do Sistema
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        
        <aside class="w-[260px] bg-white flex flex-col justify-between border-r border-slate-200 shrink-0 z-0">
            <nav class="p-4 mt-2 overflow-y-auto">
                <ul class="flex flex-col gap-1">
                    <li><a th:href="@{/dashboard}" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-500 hover:bg-slate-50 font-semibold text-sm transition-colors"><i class='bx bxs-right-arrow-circle text-lg'></i> Dashboard</a></li>
                    <li><a th:href="@{/movimentacoes}" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-500 hover:bg-slate-50 font-semibold text-sm transition-colors"><i class='bx bx-plus-medical text-lg'></i> Movimentações</a></li>
                    <li><a th:href="@{/fechamento}" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-500 hover:bg-slate-50 font-semibold text-sm transition-colors"><i class='bx bx-briefcase text-lg'></i> Fechamento de Caixa</a></li>
                    <li><a th:href="@{/relatorios}" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-accent text-white font-semibold text-sm shadow-sm transition-colors"><i class='bx bx-envelope text-lg'></i> Relatórios</a></li>
                    <li><a th:href="@{/produtos}" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-500 hover:bg-slate-50 font-semibold text-sm transition-colors"><i class='bx bxs-user-detail text-lg'></i> Produtos</a></li>
                    <li><a th:href="@{/configuracoes}" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-500 hover:bg-slate-50 font-semibold text-sm transition-colors"><i class='bx bx-cog text-lg'></i> Configurações</a></li>
                </ul>
            </nav>
            
            <div class="p-4 flex items-center gap-3 bg-white border-t mt-auto">
                <img src="https://randomuser.me/api/portraits/women/44.jpg" class="w-8 h-8 rounded-full object-cover">
                <span class="font-bold text-sm text-slate-700">Ana Silva</span>
            </div>
        </aside>

        <main class="flex-1 p-8 overflow-y-auto flex flex-col gap-6 w-full">
            <h2 class="text-3xl font-bold text-[#1a2b49]">Emissão de Relatórios</h2>
            
            <div class="bg-white rounded-2xl shadow-[0_2px_10px_-3px_rgba(0,0,0,0.05)] p-6 border border-slate-100">
                <h3 class="text-xl font-bold text-[#1a2b49] mb-6">Relatórios Disponíveis</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    
                    <div th:each="relatorio : ${listaRelatorios}" class="border border-slate-200 p-5 rounded-xl hover:border-accent hover:shadow-md transition cursor-pointer flex flex-col justify-between h-36">
                        <div>
                            <h4 class="font-bold text-[#1a2b49] text-base" th:text="${relatorio.titulo}">Título</h4>
                            <p class="text-sm text-slate-500 mt-2 line-clamp-2" th:text="${relatorio.descricao}">Descrição</p>
                        </div>
                        <div class="text-right mt-4">
                            <button onclick="gerarPDF(this)" class="text-accent text-sm font-semibold hover:underline flex items-center justify-end gap-1 w-full">
                                <i class='bx bxs-file-pdf'></i> Gerar PDF
                            </button>
                        </div>
                    </div>
                    
                </div>
            </div>
        </main>
    </div>

    <script>
        function toggleMenuUsuario() {
            const menu = document.getElementById('menuUsuario');
            menu.classList.toggle('hidden');
        }

        document.addEventListener('click', function(e) {
            const menu = document.getElementById('menuUsuario');
            if (!e.target.closest('[onclick="toggleMenuUsuario()"]') && 
                !e.target.closest('#menuUsuario')) {
                menu.classList.add('hidden');
            }
        });

        // =========================================================
        // MOTOR DE ALTERAÇÃO E DOWNLOAD DE PDF (FRONT-END)
        // =========================================================
        function gerarPDF(botaoClicado) {
            // Varre o DOM para buscar o contexto do card selecionado
            const card = botaoClicado.closest('.border-slate-200');
            const titulo = card.querySelector('h4').innerText;
            const descricao = card.querySelector('p').innerText;

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            // Estilização do cabeçalho institucional do PDF
            doc.setFontSize(22);
            doc.setTextColor(26, 45, 98); // Cor correspondente ao #1a2d62 (primary)
            doc.setFont("Helvetica", "bold");
            doc.text("SISTEMA DE GESTÃO DE CAIXA", 20, 25);
            
            doc.setFontSize(10);
            doc.setTextColor(100, 116, 139); // Slate-500
            doc.setFont("Helvetica", "normal");
            doc.text("Relatório Gerencial Corporativo", 20, 32);
            
            // Linha divisória estrutural
            doc.setDrawColor(26, 45, 98);
            doc.setLineWidth(0.5);
            doc.line(20, 36, 190, 36);

            // Subtítulo com o nome do relatório extraído do card
            doc.setFontSize(14);
            doc.setTextColor(43, 90, 238); // Cor correspondente ao #2b5aee (accent)
            doc.setFont("Helvetica", "bold");
            doc.text("Tipo de Relatório: " + titulo, 20, 48);

            // Bloco conceitual fixo solicitado sobre Gestão de Caixa
            doc.setFontSize(11);
            doc.setTextColor(30, 41, 59); // Slate-800
            doc.setFont("Helvetica", "bold");
            doc.text("Diretriz Operacional (Gestão de Caixa):", 20, 60);

            doc.setFont("Helvetica", "normal");
            const textoGestaoCaixa = "A gestão de caixa constitui o pilar básico da saúde financeira da empresa. Consiste no controle minucioso e diário de todas as entradas e saídas de capital. Um monitoramento estruturado previne a escassez de capital de giro, garante o cumprimento pontual das obrigações com fornecedores e fornece uma base de dados sólida para mitigar riscos e guiar decisões estratégicas de investimento.";
            const textoGestaoCaixaQuebrado = doc.splitTextToSize(textoGestaoCaixa, 170);
            doc.text(textoGestaoCaixaQuebrado, 20, 66);

            // Cálculo dinâmico de espaçamento para evitar sobreposição de textos
            let yPos = 66 + (textoGestaoCaixaQuebrado.length * 6) + 10;

            // Segunda linha divisória interna
            doc.setDrawColor(226, 232, 240); // Slate-200
            doc.line(20, yPos, 190, yPos);
            yPos += 10;

            // Apresentação dos dados específicos obtidos pelo Thymeleaf
            doc.setFont("Helvetica", "bold");
            doc.text("Detalhamento do Escopo:", 20, yPos);
            yPos += 6;

            doc.setFont("Helvetica", "normal");
            const descricaoQuebrada = doc.splitTextToSize(descricao, 170);
            doc.text(descricaoQuebrada, 20, yPos);

            // Rodapé com metadados temporais
            doc.setFontSize(9);
            doc.setTextColor(148, 163, 184); // Slate-400
            const dataAtual = new Date().toLocaleString('pt-BR');
            doc.text("Documento emitido via terminal web em: " + dataAtual, 20, 280);
            doc.text("Página 1 de 1", 170, 280);

            // Tratamento de caracteres especiais para o nome do arquivo baixado
            const nomeArquivo = "relatorio_" + titulo.replace(/[^a-zA-Z0-9]/g, '_').toLowerCase() + ".pdf";
            doc.save(nomeArquivo);
        }
    </script>
</body>
</html>
