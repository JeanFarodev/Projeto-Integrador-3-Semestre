<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Configurações - LOGOS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#1c3e86', accent: '#2f65f6', background: '#f4f6fa' } } } }
    </script>
</head>
<body class="flex flex-col h-screen bg-background text-slate-800 font-sans overflow-hidden">
    <header class="bg-primary text-white py-4 px-6 flex justify-between items-center shrink-0">
        <div class="flex items-center gap-3 text-lg font-semibold"><i class='bx bx-laptop text-2xl'></i><span>Sistema de Gestão</span></div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <aside class="w-[260px] bg-white flex flex-col justify-between border-r border-slate-200 shrink-0">
            <nav class="p-4 mt-2">
               <ul class="flex flex-col gap-1">
                    <li><a th:href="@{/contabilidade/dashboard(empresaId=1)}" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-500 hover:bg-slate-50 font-semibold text-sm transition-colors"><i class='bx bxs-right-arrow-circle text-lg'></i> Dashboard</a></li>
                    
                    <li><a th:href="@{/contabilidade/lista}" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-500 hover:bg-slate-50 font-semibold text-sm transition-colors"><i class='bx bx-plus-medical text-lg'></i> Movimentações</a></li>
                    
                    <li><a th:href="@{/contabilidade/saldo}" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-500 hover:bg-slate-50 font-semibold text-sm transition-colors"><i class='bx bx-briefcase text-lg'></i> Fechamento</a></li>
                    
                    <li><a th:href="@{/contabilidade/pdf(empresaId=1)}" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-500 hover:bg-slate-50 font-semibold text-sm transition-colors"><i class='bx bx-envelope text-lg'></i> Relatórios</a></li>
                    
                    <li><a th:href="@{/produtos}" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-500 hover:bg-slate-50 font-semibold text-sm transition-colors"><i class='bx bxs-user-detail text-lg'></i> Produtos</a></li>
                    
                    <li><a th:href="@{/configuracoes}" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-accent text-white font-semibold text-sm shadow-sm transition-colors"><i class='bx bx-cog text-lg'></i> Configurações</a></li>
                </ul>
            </nav>
        </aside>

        <main class="flex-1 p-8 overflow-y-auto">
            <h2 class="text-2xl font-bold text-slate-800 mb-6">Configurações do Sistema</h2>
            <div class="bg-white rounded-2xl shadow-sm p-6 border border-slate-100 max-w-2xl">
                <form class="flex flex-col gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-slate-600 mb-1">Nome da Loja</label>
                        <input type="text" value="Loja Centro" class="w-full px-4 py-2 border border-slate-200 rounded-lg text-sm">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-600 mb-1">CNPJ</label>
                        <input type="text" value="00.000.000/0001-00" class="w-full px-4 py-2 border border-slate-200 rounded-lg text-sm">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-600 mb-1">Limite de Alerta de Quebra de Caixa (R$)</label>
                        <input type="number" value="50" class="w-full px-4 py-2 border border-slate-200 rounded-lg text-sm">
                    </div>
                    <button type="button" class="mt-4 bg-accent text-white px-5 py-2.5 rounded-lg font-semibold text-sm w-max hover:bg-blue-700 transition">Salvar Alterações</button>
                </form>
            </div>
        </main>
    </div>
</body>
</html>
