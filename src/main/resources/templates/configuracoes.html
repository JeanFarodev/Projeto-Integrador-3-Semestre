<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Configurações Fiscais - LOGOS</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">

    <div class="flex h-screen">
        <aside class="w-64 bg-slate-950 text-white p-6 flex flex-col justify-between shrink-0">
            <div>
                <div class="mb-8 flex flex-col items-start">
                    <!-- Logo no topo preservando o h1 e p originais -->
                    <div class="w-16 h-16 bg-white/10 rounded-xl flex items-center justify-center mb-3 overflow-hidden">
                        <img src="https://files.manuscdn.com/user_upload_by_module/session_file/310519663610107160/RCrOONKKWPVeQvFE.png" 
                             alt="Logo LOGOS" class="w-12 h-12 object-contain">
                    </div>
                    <h1 class="text-xl font-bold tracking-wider text-blue-400">LOGOS</h1>
                    <p class="text-xs text-slate-400" th:text="${nomeEmpresa}">Nome da Empresa</p>
                </div>
                <nav class="space-y-2">
                    <a th:href="@{/caixa/dashboard}" class="flex items-center space-x-3 px-4 py-2.5 rounded-lg text-slate-400 hover:bg-slate-900 hover:text-white transition">
                        <span>📊</span> <span>Dashboard</span>
                    </a>
                    <a th:href="@{/caixa/tributacao}" class="flex items-center space-x-3 px-4 py-2.5 rounded-lg text-slate-400 hover:bg-slate-900 hover:text-white transition">
                        <span>⚖️</span> <span>Inteligência Fiscal</span>
                    </a>
                    <a th:href="@{/caixa/categorias}" class="flex items-center space-x-3 px-4 py-2.5 rounded-lg text-slate-400 hover:bg-slate-900 hover:text-white transition">
                        <span>🏷️</span> <span>Categorias</span>
                    </a>
                    <a th:href="@{/caixa/relatorios}" class="flex items-center space-x-3 px-4 py-2.5 rounded-lg text-slate-400 hover:bg-slate-900 hover:text-white transition">
                        <span>📋</span> <span>Relatórios</span>
                    </a>
                    <a th:href="@{/caixa/configuracoes}" class="flex items-center space-x-3 px-4 py-2.5 rounded-lg bg-blue-600 text-white font-medium">
                        <span>⚙️</span> <span>Configurações</span>
                    </a>
                </nav>
            </div>
            <div class="pt-4 border-t border-slate-800">
                <div class="flex items-center space-x-3">
                    <!-- Logo no perfil preservando o VG e o nome originais -->
                    <div class="w-10 h-10 rounded-full bg-white flex items-center justify-center overflow-hidden border border-slate-700">
                        <img src="https://files.manuscdn.com/user_upload_by_module/session_file/310519663610107160/RCrOONKKWPVeQvFE.png" 
                             alt="Avatar LOGOS" class="w-8 h-8 object-contain">
                    </div>
                    <div>
                        <p class="text-sm font-medium text-slate-200">Vinicius Gama</p>
                       <a href="/logout" class="text-xs text-red-400 hover:underline">Sair do sistema</a>
                    </div>
                </div>
            </div>
        </aside>

        <main class="flex-1 p-8 overflow-y-auto">
            <header class="mb-8">
                <h2 class="text-2xl font-bold text-slate-900">Configurações do Sistema</h2>
                <p class="text-sm text-slate-500">Gerencie os parâmetros tributários e institucionais da empresa.</p>
            </header>

            <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-6 max-w-xl">
                <form th:action="@{/caixa/configuracoes/salvar}" th:object="${empresaObjeto}" method="POST" class="space-y-5">
                    
                    <input type="hidden" th:field="*{id}" />
                    
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Nome da Empresa / Razão Social</label>
                        <input type="text" th:field="*{nome}" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">CNPJ</label>
                        <input type="text" th:field="*{documento}" id="cnpjInput" oninput="mascaraCNPJ(this)" 
                               maxlength="18" placeholder="00.000.000/0001-00"
                               class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Regime Tributário Vigente</label>
                        <select th:field="*{regimeTributario}" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white">
                            <option value="SIMPLES_NACIONAL">Simples Nacional (Base Padrão 6%)</option>
                            <option value="MEI">MEI (Simei — Taxa Fixa Mensal)</option>
                            <option value="LUCRO_PRESUMIDO">Lucro Presumido</option>
                            <option value="LUCRO_REAL">Lucro Real (Regime Geral)</option>
                        </select>
                    </div>

                    <div class="pt-4 border-t border-slate-100 flex justify-end">
                        <button type="submit" class="px-5 py-2.5 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-lg transition shadow-sm cursor-pointer">
                            Salvar Parâmetros Fiscais
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script>
        function mascaraCNPJ(i) {
            let v = i.value.replace(/\D/g, ""); 
            if (v.length > 14) v = v.substring(0, 14); 
            
            v = v.replace(/^(\d{2})(\d)/, "$1.$2"); 
            v = v.replace(/^(\d{2})\.(\d{3})(\d)/, "$1.$2.$3"); 
            v = v.replace(/\.(\d{3})(\d)/, ".$1/$2"); 
            v = v.replace(/(\d{4})(\d)/, "$1-$2"); 
            
            i.value = v;
        }
    </script>
</body>
</html>
