<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Gestão</title>
    

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        primary: '#1c3e86',
                        accent: '#2f65f6',
                        background: '#f4f6fa'
                    }
                }
            }
        }
    </script>
</head>
<body class="flex items-center justify-center min-h-screen bg-background font-sans">

    <div class="bg-white p-10 rounded-2xl shadow-md w-full max-w-md border border-slate-100 mx-4">
        
        <div class="flex flex-col items-center justify-center mb-8 text-primary">
            <div class="w-16 h-16 bg-primary/10 rounded-full flex items-center justify-center mb-4">
                <i class='bx bx-laptop text-4xl'></i>
            </div>
            <h1 class="text-2xl font-bold text-slate-800">Acesso ao Sistema</h1>
            <p class="text-slate-500 text-sm mt-1">Insira suas credenciais para continuar</p>
        </div>

        <form id="formLogin" class="flex flex-col gap-5">
            
            <div>
                <label for="usuario" class="block text-sm font-semibold text-slate-600 mb-1.5">Usuário ou E-mail</label>
                <div class="relative">
                    <i class='bx bx-user absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xl'></i>
                    <input type="text" id="usuario" name="usuario" required placeholder="ex: ana.silva"
                           class="w-full pl-10 pr-4 py-3 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-accent focus:ring-1 focus:ring-accent transition-all">
                </div>
            </div>

            <div>
                <div class="flex justify-between items-center mb-1.5">
                    <label for="senha" class="block text-sm font-semibold text-slate-600">Senha</label>
                    <a href="#" class="text-xs font-semibold text-accent hover:underline">Esqueceu a senha?</a>
                </div>
                <div class="relative">
                    <i class='bx bx-lock-alt absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xl'></i>
                    <input type="password" id="senha" name="senha" required placeholder="••••••••"
                           class="w-full pl-10 pr-4 py-3 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-accent focus:ring-1 focus:ring-accent transition-all">
                </div>
            </div>

            <div class="flex items-center gap-2 mt-1">
                <input type="checkbox" id="lembrar" class="w-4 h-4 text-accent border-slate-300 rounded focus:ring-accent">
                <label for="lembrar" class="text-sm text-slate-600 cursor-pointer">Lembrar minhas credenciais</label>
            </div>

            <!-- Mensagem de erro -->
            <div id="mensagemErro" class="hidden bg-red-50 border border-red-200 text-red-600 text-sm px-4 py-3 rounded-xl text-center">
                Usuário ou senha incorretos.
            </div>

            <button type="submit" id="btnEntrar" class="mt-2 w-full bg-primary text-white py-3 rounded-xl font-bold hover:bg-blue-900 transition-colors shadow-sm flex justify-center items-center gap-2">
                Continuar <i class='bx bx-right-arrow-alt text-2xl'></i>
            </button>

        </form>
    </div>

    <script>
    const form = document.getElementById('formLogin');
    const inputUsuario = document.getElementById('usuario');
    const inputSenha = document.getElementById('senha');
    const mensagemErro = document.getElementById('mensagemErro');
    const btnEntrar = document.getElementById('btnEntrar');

    form.addEventListener('submit', function(event) {
        event.preventDefault();

        // Trava o botão para evitar cliques duplos
        btnEntrar.disabled = true;
        btnEntrar.innerHTML = `<i class='bx bx-loader-alt bx-spin text-2xl'></i> Verificando...`;
        mensagemErro.classList.add('hidden');

        const dadosFormulario = new URLSearchParams();
        dadosFormulario.append('usuario', inputUsuario.value);
        dadosFormulario.append('senha', inputSenha.value);

        console.log('Enviando dados para o Spring...');

        fetch('/login-spring', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded'
            },
            body: dadosFormulario
        })
        .then(response => {
            console.log('Resposta recebida do servidor. Status:', response.status);
            console.log('Redirecionado pelo servidor?', response.redirected);

            // Cenário 1: Se o Spring Security autenticou e mandou redirecionar
            if (response.redirected) {
                console.log('Redirecionando para:', response.url);
                window.location.href = response.url;
                return;
            }

            // Cenário 2: Se a resposta foi OK (Status 200), força a ida para o Dashboard
            if (response.ok) {
                window.location.href = '/caixa/dashboard';
                return;
            }

            // Cenário 3: Se caiu em erro (401 Não Autorizado, 403, etc)
            throw new Error('Falha na autenticação. Status: ' + response.status);
        })
        .catch(error => {
            console.error('Erro capturado no fluxo de login:', error);
            
            // DESTRAVA O BOTÃO SE DER ERRO
            mensagemErro.textContent = 'Usuário ou senha incorretos ou erro de conexão.';
            mensagemErro.classList.remove('hidden');
            btnEntrar.disabled = false;
            btnEntrar.innerHTML = `Continuar <i class='bx bx-right-arrow-alt text-2xl'></i>`;
        });
    });
</script>


</body>
