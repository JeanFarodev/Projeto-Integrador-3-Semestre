<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LOGOS</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        primary: '#1c3e86',
                        accent: '#2f65f6',
                        background: '#f4f6fa'
                    }
                }
            }
        }
    </script>
</head>
<body class="flex items-center justify-center min-h-screen bg-background font-sans">

    <input type="hidden" id="csrfToken" th:value="${_csrf.token}" />
    <input type="hidden" id="csrfHeader" th:value="${_csrf.headerName}" />

    <div class="bg-white p-10 rounded-2xl shadow-md w-full max-w-md border border-slate-100 mx-4">
        
        <div class="flex flex-col items-center justify-center mb-8 text-primary">
            <!-- Logo com link curto -->
            <div class="w-24 h-24 bg-primary/5 rounded-full flex items-center justify-center mb-4 overflow-hidden">
                <img src="https://files.manuscdn.com/user_upload_by_module/session_file/310519663610107160/RCrOONKKWPVeQvFE.png" 
                     alt="Logo LOGOS" class="w-20 h-20 object-contain">
            </div>
            
            <h1 class="text-3xl font-extrabold text-primary">LOGOS</h1>
            
            <p class="text-slate-500 text-sm mt-1">Insira suas credenciais para continuar</p>
        </div>

        <form id="formLogin" class="flex flex-col gap-5">
            
            <div>
                <label for="usuario" class="block text-sm font-semibold text-slate-600 mb-1.5">Usuário ou E-mail</label>
                <div class="relative">
                    <i class='bx bx-user absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xl'></i>
                    <input type="text" id="usuario" name="username" required placeholder="ex: ana.silva"
                           class="w-full pl-10 pr-4 py-3 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-accent focus:ring-1 focus:ring-accent transition-all bg-white">
                </div>
            </div>

            <div>
                <div class="flex justify-between items-center mb-1.5">
                    <label for="senha" class="block text-sm font-semibold text-slate-600">Senha</label>
                    <a href="#" class="text-xs font-semibold text-accent hover:underline">Esqueceu a senha?</a>
                </div>
                <div class="relative">
                    <i class='bx bx-lock-alt absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xl'></i>
                    <input type="password" id="senha" name="password" required placeholder="••••••••"
                           class="w-full pl-10 pr-4 py-3 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-accent focus:ring-1 focus:ring-accent transition-all bg-white">
                </div>
            </div>

            <div class="flex items-center gap-2 mt-1">
                <input type="checkbox" id="lembrar" class="w-4 h-4 text-accent border-slate-300 rounded focus:ring-accent">
                <label for="lembrar" class="text-sm text-slate-600 cursor-pointer">Lembrar minhas credenciais</label>
            </div>

            <div id="mensagemErro" class="hidden bg-red-50 border border-red-200 text-red-600 text-sm px-4 py-3 rounded-xl text-center font-medium">
                Usuário ou senha incorretos.
            </div>

            <button type="submit" id="btnEntrar" class="mt-2 w-full bg-primary text-white py-3 rounded-xl font-bold hover:bg-blue-900 transition-colors shadow-sm flex justify-center items-center gap-2 cursor-pointer">
                Continuar <i class='bx bx-right-arrow-alt text-2xl'></i>
            </button>

        </form>
    </div>

    <script>
    const form = document.getElementById('formLogin');
    const inputUsuario = document.getElementById('usuario');
    const inputSenha = document.getElementById('senha');
    const mensagemErro = document.getElementById('mensagemErro');
    const btnEntrar = document.getElementById('btnEntrar');
    
    const csrfToken = document.getElementById('csrfToken').value;
    const csrfHeader = document.getElementById('csrfHeader').value;

    form.addEventListener('submit', function(event) {
        event.preventDefault();

        btnEntrar.disabled = true;
        btnEntrar.innerHTML = `<i class='bx bx-loader-alt bx-spin text-2xl'></i> Verificando...`;
        mensagemErro.classList.add('hidden');

        const dadosFormulario = new URLSearchParams();
        dadosFormulario.append('username', inputUsuario.value);
        dadosFormulario.append('password', inputSenha.value);

        fetch('/login', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
                [csrfHeader]: csrfToken
            },
            body: dadosFormulario
        })
        .then(response => {
            if (response.redirected) {
                window.location.href = response.url;
                return;
            }

            if (response.ok) {
                window.location.href = '/caixa/dashboard';
                return;
            }

            throw new Error('Falha na autenticação');
        })
        .catch(error => {
            mensagemErro.textContent = 'Usuário ou senha incorretos.';
            mensagemErro.classList.remove('hidden');
            btnEntrar.disabled = false;
            btnEntrar.innerHTML = `Continuar <i class='bx bx-right-arrow-alt text-2xl'></i>`;
        });
    });
</script>

</body>
</html>
